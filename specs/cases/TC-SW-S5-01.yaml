id: TC-SW-S5-01
summary: Content-Disposition なしの EP2 は 400、コード帯 13xx で、認可エラーと混ざらない
baseline: BL-SW-POST-DIRECT
overrides:
  - path: action.params.contentDisposition
    op: remove
expect:
  - kind: http_status
    status: 400
    viewpoints: []
  - kind: result
    assert:
      kind: keys
      value:
        - "@context"
        - "@type"
        - timestamp
        - error
      at: body
    viewpoints: []
  - kind: result
    assert:
      kind: matches
      pattern: "^WEKO_SWORDSERVER_E_13\\d\\d: "
      at: body.error
    viewpoints: []
  - kind: result
    assert:
      kind: one_of
      values:
        - BadRequest
        - ContentMalformed
      at: body.@type
    viewpoints: []
  - kind: result
    assert:
      kind: matches
      pattern: "^WEKO_SWORDSERVER_E_\\d{4}: \\S"
      at: body.error
    viewpoints: []
polarity: error
evidence:
  sources:
    - screenshot
    - browser_console
    - browser_network
    - db_records
    - app_log
    - db_log
  timing: before_and_after
  trace: on_failure
  ignore:
    - WARNING.*WEKO_SWORDSERVER_E_1303
    - WARNING.*Cannot get filename by Content-Disposition\.
evidenceWaivers: []
priority: P1
tags:
  - spec:S5-01
  - tier:1
  - ep:EP2
appliesTo:
  branch: test/sword-error-codes
  release: integration_test_spec_v4.2
automation:
  status: generated
  impl: tests/generated/test_tc_sw_s5_01.py
viewpoints:
  - VP-SW-BD-01
  - VP-SW-BD-02
  - VP-SW-AU-31
note: 期待は帯 13xx まで（仕様書 S5-01）。個別コードは S5-02(c) の 1303 が担う。
