id: TC-SW-S8-02
summary: Workflow 登録で複数アイテムが部分完了すると、アクティビティごとの案内が "; " で連結され各案内に継続 URL がある
baseline: BL-SW-POST-DIRECT
overrides:
  - path: action.params.token
    op: set
    value: "{{env.SW_TOKEN_W}}"
  - path: action.params.file
    op: set
    value: fixtures/generated/simplezip-multi-item.zip
  - path: action.params.filename
    op: set
    value: simplezip-multi-item.zip
  - path: action.params.contentDisposition
    op: set
    value: attachment; filename=simplezip-multi-item.zip
  - path: action.params.digest
    op: set
    value: SHA-256=0421ab2a3e203140ae7c6bfcf6898adb8296a99b76693b7288e73080994f9303
expect:
  - kind: http_status
    status: 400
    viewpoints: []
  - kind: result
    assert:
      kind: keys
      value:
        - "@context"
        - "@type"
        - timestamp
        - error
      at: body
    viewpoints: []
  - kind: result
    assert:
      kind: matches
      pattern: "^WEKO_SWORDSERVER_E_2401: "
      at: body.error
    viewpoints: []
  - kind: result
    assert:
      kind: equals
      value: BadRequest
      at: body.@type
    viewpoints: []
  - kind: result
    assert:
      kind: matches
      pattern: "^WEKO_SWORDSERVER_E_2401: [^;]*https?://[^;]*; [^;]*https?://"
      at: body.error
    viewpoints: []
polarity: error
evidence:
  sources:
    - screenshot
    - browser_console
    - browser_network
    - db_records
    - app_log
    - db_log
  timing: before_and_after
  trace: on_failure
  ignore:
    - WARNING.*WEKO_SWORDSERVER_E_2401
    - "WARNING.*Registration of item is pending completion\\. Please open the following URL to continue with the remaining operations:"
    - WARNING.*Registration of item is pending completion
evidenceWaivers: []
priority: P2
tags:
  - spec:S8-02
  - tier:1
  - ep:EP2
  - needs:real-metadata
  - leaves:activities
appliesTo:
  branch: test/sword-error-codes
  release: integration_test_spec_v4.2
automation:
  status: generated
  impl: tests/generated/test_tc_sw_s8_02.py
viewpoints:
  - VP-SW-EG-11
note: C-W（SW_TOKEN_W）。アクティビティと下書きが残る（片付けるヘルパーがない）。fixtures の CSV は項目を実際に登録できる形ではないため、対象環境から書き出した複数アイテムのメタデータへの差し替えが必要（fixtures/README.md）。継続 URL の http(s) 形式は 2401 のメッセージ定義（{url}）からの推定。
