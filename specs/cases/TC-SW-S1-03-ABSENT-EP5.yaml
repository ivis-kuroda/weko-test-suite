id: TC-SW-S1-03-ABSENT-EP5
summary: 未提示（Authorization なし）で EP5 を呼ぶと 401 になり、独自コードが付かない
baseline: BL-SW-DELETE-DIRECT
overrides:
  - path: action.params.token
    op: remove
  - path: action.params.recid
    op: set
    value: "{{env.SW_R1}}"
expect:
  - kind: http_status
    status: 401
    viewpoints: []
  - kind: result
    assert:
      kind: matches
      pattern: ^(?!WEKO_SWORDSERVER_E_)
      at: body.error
    viewpoints: []
  - kind: result
    assert:
      kind: one_of
      values:
        - AuthenticationRequired
        - Unauthorized
      at: body.@type
    viewpoints: []
  - kind: operation_result
    operation: OP-SWORD-GET-DEPOSIT
    params:
      recid: "{{env.SW_R1}}"
      token: "{{env.SW_TOKEN_1}}"
    assert:
      kind: equals
      value: 200
      at: status
    viewpoints: []
polarity: error
evidence:
  sources:
    - screenshot
    - browser_console
    - browser_network
    - db_records
    - app_log
    - db_log
  timing: before_and_after
  trace: on_failure
  ignore:
    - Authentication is required
    - Forbidden
    - Not allowed operation in your
evidenceWaivers: []
at:
  F-SW-EP: L-SW-EP5
  F-SW-TOKEN-STATE: L-SW-TOKEN-ABSENT
priority: P2
tags:
  - spec:S1-03
  - tier:1
  - ep:EP5
  - token:absent
appliesTo:
  branch: test/sword-error-codes
  release: integration_test_spec_v4.2
automation:
  status: manual
viewpoints:
  - VP-SW-AU-01
