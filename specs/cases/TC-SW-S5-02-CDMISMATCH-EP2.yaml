id: TC-SW-S5-02-CDMISMATCH-EP2
summary: EP2 に (d) Content-Disposition のファイル名が本文と不一致 を送ると 400、1304
baseline: BL-SW-POST-DIRECT
overrides:
  - path: action.params.contentDisposition
    op: set
    value: attachment; filename=other-name.zip
expect:
  - kind: http_status
    status: 400
    viewpoints: []
  - kind: result
    assert:
      kind: keys
      value:
        - "@context"
        - "@type"
        - timestamp
        - error
      at: body
    viewpoints: []
  - kind: result
    assert:
      kind: matches
      pattern: "^WEKO_SWORDSERVER_E_1304: "
      at: body.error
    viewpoints: []
  - kind: result
    assert:
      kind: equals
      value: BadRequest
      at: body.@type
    viewpoints: []
polarity: error
evidence:
  sources:
    - screenshot
    - browser_console
    - browser_network
    - db_records
    - app_log
    - db_log
  timing: before_and_after
  trace: on_failure
  ignore:
    - (WARNING|ERROR).*WEKO_SWORDSERVER_E_1304
    - (WARNING|ERROR).*Not found
evidenceWaivers: []
at:
  F-SW-FILE-DEFECT: L-SW-DEFECT-CDMISMATCH
  F-SW-WRITE-EP: L-SW-WEP-EP2
priority: P2
tags:
  - spec:S5-02
  - tier:1
  - finding:A-5-on-hold
  - ep:EP2
  - defect:cdmismatch
appliesTo:
  branch: test/sword-error-codes
  release: integration_test_spec_v4.2
automation:
  status: generated
  impl: tests/generated/test_tc_sw_s5_02_cdmismatch_ep2.py
viewpoints:
  - VP-SW-BD-71
note: EP4 は先に recid の存在確認があるため R1 は存在する状態にする（バンドル済みの R1 を使う）。
