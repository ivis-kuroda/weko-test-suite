id: TC-SW-S5-05-ROCRATE-NOMETA-EP4
summary: EP4 に RO-Crate で ro-crate-metadata.json なし を送ると 415（構成不正は 400 も可）で 14xx
baseline: BL-SW-PUT-DIRECT
overrides:
  - path: action.params.file
    op: set
    value: fixtures/generated/rocrate-missing-metadata.zip
  - path: action.params.filename
    op: set
    value: rocrate-missing-metadata.zip
  - path: action.params.contentDisposition
    op: set
    value: attachment; filename=rocrate-missing-metadata.zip
  - path: action.params.digest
    op: set
    value: SHA-256=768ef5fa649d08e9c2a52a55b333e165e80b242b57ef98d0753f5c7335fa9249
expect:
  - kind: http_status
    status: 415
    alsoAccepts:
      - 400
    viewpoints: []
  - kind: result
    assert:
      kind: keys
      value:
        - "@context"
        - "@type"
        - timestamp
        - error
      at: body
    viewpoints: []
  - kind: result
    assert:
      kind: matches
      pattern: "^WEKO_SWORDSERVER_E_140[4-7]: "
      at: body.error
    viewpoints: []
  - kind: result
    assert:
      kind: one_of
      values:
        - MetadataFormatNotAcceptable
        - ContentMalformed
      at: body.@type
    viewpoints: []
  - kind: operation_result
    operation: OP-APP-LOG
    params:
      since: "{{run.startedAt}}"
    assert:
      kind: matches
      pattern: "\\bWARNING\\b[^\\n]*\\[(?:WEKO_SWORDSERVER_E_)?140[4-7]\\] PUT /sword/deposit/[^\\s:]+:"
    viewpoints: []
polarity: error
evidence:
  sources:
    - screenshot
    - browser_console
    - browser_network
    - db_records
    - app_log
    - db_log
  timing: before_and_after
  trace: on_failure
  ignore:
    - .*
evidenceWaivers: []
at:
  F-SW-PKG-VARIANT: L-SW-PKGV-ROCRATE-NOMETA
  F-SW-WRITE-EP: L-SW-WEP-EP4
priority: P2
tags:
  - spec:S5-05
  - tier:1
  - ep:EP4
  - variant:rocrate-nometa
  - log:handler-line
appliesTo:
  branch: test/sword-error-codes
  release: integration_test_spec_v4.2
automation:
  status: generated
  impl: tests/generated/test_tc_sw_s5_05_rocrate_nometa_ep4.py
viewpoints:
  - VP-SW-BD-74
note: 仕様書は『415 または 400 で 1404〜1407 のいずれか』（U-14 個別対応は要確認）。仕様書どおりの許容範囲で判定し、個別コードは実測を記録する。
