id: TC-SW-S2-01-CONTRIBUTOR-EP1
summary: CONTRIBUTOR のトークン①で EP1 を呼ぶとロール判定なしで 200（回帰）
baseline: BL-SW-GET-SERVICE-DOC
overrides:
  - path: action.params.token
    op: set
    value: "{{env.SW_TOKEN_ROLE_CONTRIBUTOR}}"
expect:
  - kind: http_status
    status: 200
    viewpoints: []
polarity: nominal
evidence:
  sources:
    - screenshot
    - browser_console
    - browser_network
    - db_records
    - app_log
    - db_log
  timing: before_and_after
  trace: on_failure
  ignore:
    - .*
evidenceWaivers: []
at:
  F-SW-EP: L-SW-EP1
  F-SW-ROLE: L-SW-ROLE-CONTRIBUTOR
priority: P2
tags:
  - spec:S2-01
  - tier:1
  - ep:EP1
  - role:contributor
  - log:not-judged
appliesTo:
  branch: test/sword-error-codes
  release: integration_test_spec_v4.2
automation:
  status: generated
  impl: tests/generated/test_tc_sw_s2_01_contributor_ep1.py
viewpoints:
  - VP-SW-AU-30
note: ロール別の可否は U-01（要確認）。改修前ベースライン（S0-06）が無いため、不許可と確定できるのは一般ユーザの EP2/EP4/EP5（docs/BASELINE.md の想定）のみ。それ以外のロールは許可（その EP の通常結果）または 403（コードなし）を許容し、実測値を記録する。非破壊にするため EP2 はファイルパートなし（許可なら 1301）、EP4/EP5 は存在しない recid R9（許可なら 2101）で呼ぶ（認可はこれらの検査より先）。仕様書の『正常ファイル／R1／R4』からの変更は TIER1-STATUS の判断事項を参照。
