id: TC-SW-S5-05-PACKAGING-EP2
summary: EP2 に 非対応の Packaging を送ると 415（構成不正は 400 も可）で 14xx
baseline: BL-SW-POST-DIRECT
overrides:
  - path: action.params.packaging
    op: set
    value: http://example.org/ath/unsupported-packaging
expect:
  - kind: http_status
    status: 415
    viewpoints: []
  - kind: result
    assert:
      kind: keys
      value:
        - "@context"
        - "@type"
        - timestamp
        - error
      at: body
    viewpoints: []
  - kind: result
    assert:
      kind: matches
      pattern: "^WEKO_SWORDSERVER_E_1402: "
      at: body.error
    viewpoints: []
  - kind: result
    assert:
      kind: equals
      value: PackagingFormatNotAcceptable
      at: body.@type
    viewpoints: []
polarity: error
evidence:
  sources:
    - screenshot
    - browser_console
    - browser_network
    - db_records
    - app_log
    - db_log
  timing: before_and_after
  trace: on_failure
  ignore:
    - WARNING.*WEKO_SWORDSERVER_E_1402
    - "WARNING.*Not accept packaging:"
evidenceWaivers: []
at:
  F-SW-PKG-VARIANT: L-SW-PKGV-PACKAGING
  F-SW-WRITE-EP: L-SW-WEP-EP2
priority: P2
tags:
  - spec:S5-05
  - tier:1
  - ep:EP2
  - variant:packaging
appliesTo:
  branch: test/sword-error-codes
  release: integration_test_spec_v4.2
automation:
  status: generated
  impl: tests/generated/test_tc_sw_s5_05_packaging_ep2.py
viewpoints:
  - VP-SW-BD-74
note: 非対応 Packaging の値は仕様書に指定がないため http://example.org/ath/unsupported-packaging を使う（既定設定では 1402。* を含む設定では 1408、未指定は 1403。U-14・U-22）。
