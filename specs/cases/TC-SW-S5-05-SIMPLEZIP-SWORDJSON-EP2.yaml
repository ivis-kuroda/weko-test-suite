id: TC-SW-S5-05-SIMPLEZIP-SWORDJSON-EP2
summary: EP2 に SimpleZip に sword.json あり を送ると 415（構成不正は 400 も可）で 14xx
baseline: BL-SW-POST-DIRECT
overrides:
  - path: action.params.file
    op: set
    value: fixtures/generated/simplezip-with-sword-json.zip
  - path: action.params.filename
    op: set
    value: simplezip-with-sword-json.zip
  - path: action.params.contentDisposition
    op: set
    value: attachment; filename=simplezip-with-sword-json.zip
  - path: action.params.digest
    op: set
    value: SHA-256=c6e32886c35558a742294db835a7c7d56ecbc64d68415c1334f0367290b7694c
expect:
  - kind: http_status
    status: 415
    alsoAccepts:
      - 400
    viewpoints: []
  - kind: result
    assert:
      kind: keys
      value:
        - "@context"
        - "@type"
        - timestamp
        - error
      at: body
    viewpoints: []
  - kind: result
    assert:
      kind: matches
      pattern: "^WEKO_SWORDSERVER_E_140[4-7]: "
      at: body.error
    viewpoints: []
  - kind: result
    assert:
      kind: one_of
      values:
        - MetadataFormatNotAcceptable
        - ContentMalformed
      at: body.@type
    viewpoints: []
polarity: error
evidence:
  sources:
    - screenshot
    - browser_console
    - browser_network
    - db_records
    - app_log
    - db_log
  timing: before_and_after
  trace: on_failure
  ignore:
    - WEKO_SWORDSERVER_E_1404
    - SWORDBagIt requires metadate/sword\.json\.
    - WEKO_SWORDSERVER_E_1405
    - packaging format is SimpleZip, but sword\.json is found\.
    - WEKO_SWORDSERVER_E_1406
    - ro-crate-metadata\.json is required in data/ directory\.
    - WEKO_SWORDSERVER_E_1407
    - SimpleZip requires ro-crate-metadata\.json or other metadata file\.
evidenceWaivers: []
at:
  F-SW-PKG-VARIANT: L-SW-PKGV-SIMPLEZIP-SWORDJSON
  F-SW-WRITE-EP: L-SW-WEP-EP2
priority: P2
tags:
  - spec:S5-05
  - tier:1
  - ep:EP2
  - variant:simplezip-swordjson
appliesTo:
  branch: test/sword-error-codes
  release: integration_test_spec_v4.2
automation:
  status: manual
viewpoints:
  - VP-SW-BD-74
note: 仕様書は『415 または 400 で 1404〜1407 のいずれか』（U-14 個別対応は要確認）。仕様書どおりの許容範囲で判定し、個別コードは実測を記録する。
