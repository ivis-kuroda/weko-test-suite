id: TC-SW-S1-03-ABSENT-EP4
summary: 未提示（Authorization なし）で EP4 を呼ぶと 401 になり、独自コードが付かない
baseline: BL-SW-PUT-DIRECT
overrides:
  - path: action.params.token
    op: remove
expect:
  - kind: http_status
    status: 401
    viewpoints: []
  - kind: result
    assert:
      kind: matches
      pattern: ^(?!WEKO_SWORDSERVER_E_)
      at: body.error
    viewpoints: []
  - kind: result
    assert:
      kind: one_of
      values:
        - AuthenticationRequired
        - Unauthorized
      at: body.@type
    viewpoints: []
polarity: error
evidence:
  sources:
    - screenshot
    - browser_console
    - browser_network
    - db_records
    - app_log
    - db_log
  timing: before_and_after
  trace: on_failure
  ignore:
    - .*
evidenceWaivers: []
at:
  F-SW-EP: L-SW-EP4
  F-SW-TOKEN-STATE: L-SW-TOKEN-ABSENT
priority: P2
tags:
  - spec:S1-03
  - tier:1
  - ep:EP4
  - token:absent
  - log:not-judged
appliesTo:
  branch: test/sword-error-codes
  release: integration_test_spec_v4.2
automation:
  status: generated
  impl: tests/generated/test_tc_sw_s1_03_absent_ep4.py
viewpoints:
  - VP-SW-AU-01
