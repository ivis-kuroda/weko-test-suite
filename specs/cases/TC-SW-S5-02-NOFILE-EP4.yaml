id: TC-SW-S5-02-NOFILE-EP4
summary: EP4 に (a) ファイルパートなし を送ると 400、1301
baseline: BL-SW-PUT-DIRECT
overrides:
  - path: action.operation
    op: set
    value: OP-SWORD-PUT-NOFILE
  - path: action.params.file
    op: remove
  - path: action.params.filename
    op: remove
expect:
  - kind: http_status
    status: 400
    viewpoints: []
  - kind: result
    assert:
      kind: keys
      value:
        - "@context"
        - "@type"
        - timestamp
        - error
      at: body
    viewpoints: []
  - kind: result
    assert:
      kind: matches
      pattern: "^WEKO_SWORDSERVER_E_1301: "
      at: body.error
    viewpoints: []
  - kind: result
    assert:
      kind: equals
      value: ContentMalformed
      at: body.@type
    viewpoints: []
  - kind: operation_result
    operation: OP-APP-LOG
    params:
      since: "{{run.startedAt}}"
    assert:
      kind: matches
      pattern: "\\bWARNING\\b[^\\n]*\\[(?:WEKO_SWORDSERVER_E_)?1301\\] PUT /sword/deposit/[^\\s:]+:"
    viewpoints: []
polarity: error
evidence:
  sources:
    - screenshot
    - browser_console
    - browser_network
    - db_records
    - app_log
    - db_log
  timing: before_and_after
  trace: on_failure
  ignore:
    - .*
evidenceWaivers: []
at:
  F-SW-FILE-DEFECT: L-SW-DEFECT-NOFILE
  F-SW-WRITE-EP: L-SW-WEP-EP4
priority: P2
tags:
  - spec:S5-02
  - tier:1
  - ep:EP4
  - defect:nofile
  - log:handler-line
appliesTo:
  branch: test/sword-error-codes
  release: integration_test_spec_v4.2
automation:
  status: generated
  impl: tests/generated/test_tc_sw_s5_02_nofile_ep4.py
viewpoints:
  - VP-SW-BD-71
note: EP4 は先に recid の存在確認があるため R1 は存在する状態にする（バンドル済みの R1 を使う）。
