id: TC-SW-S5-05-XML-EP4
summary: EP4 に XML メタデータを送ると 415、1410（XML を管理画面で有効・Direct にした場合）
baseline: BL-SW-PUT-DIRECT
overrides:
  - path: action.params.file
    op: set
    value: fixtures/generated/simplezip-xml.zip
  - path: action.params.filename
    op: set
    value: simplezip-xml.zip
  - path: action.params.contentDisposition
    op: set
    value: attachment; filename=simplezip-xml.zip
  - path: action.params.digest
    op: set
    value: SHA-256=0d3dc285131ed9a6ae05f10bc3dc0f576d6330fc40108e21b4c7bd5fa1f3ec6d
expect:
  - kind: http_status
    status: 415
    viewpoints: []
  - kind: result
    assert:
      kind: keys
      value:
        - "@context"
        - "@type"
        - timestamp
        - error
      at: body
    viewpoints: []
  - kind: result
    assert:
      kind: matches
      pattern: "^WEKO_SWORDSERVER_E_1410: "
      at: body.error
    viewpoints: []
  - kind: result
    assert:
      kind: equals
      value: MetadataFormatNotAcceptable
      at: body.@type
    viewpoints: []
  - kind: operation_result
    operation: OP-APP-LOG
    params:
      since: "{{run.startedAt}}"
    assert:
      kind: matches
      pattern: "\\bWARNING\\b[^\\n]*\\[(?:WEKO_SWORDSERVER_E_)?1410\\] PUT /sword/deposit/[^\\s:]+:"
    viewpoints: []
polarity: error
evidence:
  sources:
    - screenshot
    - browser_console
    - browser_network
    - db_records
    - app_log
    - db_log
  timing: before_and_after
  trace: on_failure
  ignore:
    - .*
evidenceWaivers: []
at:
  F-SW-PKG-VARIANT: L-SW-PKGV-XML
  F-SW-WRITE-EP: L-SW-WEP-EP4
priority: P2
tags:
  - spec:S5-05
  - tier:1
  - ep:EP4
  - variant:xml
  - automation:manual
  - blocked:config-toggle-xml-S0-03
  - log:handler-line
appliesTo:
  branch: test/sword-error-codes
  release: integration_test_spec_v4.2
automation:
  status: manual
viewpoints:
  - VP-SW-BD-74
note: 管理画面の SWORD API 設定（sword_api_setting）で XML を有効・登録方式 Direct にする必要がある（既定は XML 無効で 1409 が先に返る）。設定変更は plugin の操作にないためオーナー判断により手動。実施後は元に戻す。
