id: TC-SW-S5-05-CONTENT-TYPE-EP2
summary: EP2 に非対応の Content-Type を送ると 415、1401（到達不能の可能性）
baseline: BL-SW-POST-DIRECT
overrides: []
expect:
  - kind: http_status
    status: 415
    viewpoints: []
  - kind: result
    assert:
      kind: keys
      value:
        - "@context"
        - "@type"
        - timestamp
        - error
      at: body
    viewpoints: []
  - kind: result
    assert:
      kind: matches
      pattern: "^WEKO_SWORDSERVER_E_1401: "
      at: body.error
    viewpoints: []
  - kind: result
    assert:
      kind: equals
      value: ContentTypeNotAcceptable
      at: body.@type
    viewpoints: []
  - kind: operation_result
    operation: OP-APP-LOG
    params:
      since: "{{run.startedAt}}"
    assert:
      kind: matches
      pattern: "\\bWARNING\\b[^\\n]*\\[(?:WEKO_SWORDSERVER_E_)?1401\\] POST /sword/service-document:"
    viewpoints: []
polarity: error
evidence:
  sources:
    - screenshot
    - browser_console
    - browser_network
    - db_records
    - app_log
    - db_log
  timing: before_and_after
  trace: on_failure
  ignore:
    - .*
evidenceWaivers: []
at:
  F-SW-PKG-VARIANT: L-SW-PKGV-CONTENT-TYPE
  F-SW-WRITE-EP: L-SW-WEP-EP2
priority: P2
tags:
  - spec:S5-05
  - tier:1
  - ep:EP2
  - variant:content-type
  - automation:manual
  - blocked:content-type-not-expressible
  - remark:Q-5
  - remark:U-22
  - log:handler-line
appliesTo:
  branch: test/sword-error-codes
  release: integration_test_spec_v4.2
automation:
  status: manual
viewpoints:
  - VP-SW-BD-74
note: multipart の Content-Type は HTTP ライブラリが設定するため plugin.yaml の操作では指定できない（plugin.yaml 冒頭の注記）。さらに既定設定では multipart/form-data が許容されるため 1401 に到達しない可能性がある（Q-5・U-22）。手動で curl を使い、到達できなければ『実施不可』として理由を記録する。baseline・overrides は到達する場合の期待値を示すだけで、overrides は空（実行しても通常の登録になる）。
