id: VP-SW-AU-30
title: 上表の全セルを実行し、改修前後で結果を比較する（ロール不足は 403、コードなし）
rationale: 前提：各ロールのユーザでトークン①を発行。SWORD API を使えないロールのトークンを含む。操作：各セルのロール×EP で呼び出す（SWORD API を使えないロールで EP2/4/5 を呼ぶ操作を含む）。期待結果：許可・不許可の結果（ステータスと文言）が改修前と同じ（C-AUTH-1・C-AUTH-2）。EP2/4/5 のみ不許可は 403（独自コードなし）。EP1/EP3 はロール判定なしで許可（回帰）で不許可なし。ロール不足の 403 は、アクティビティ用スコープ不足の専用 403（AU-10、`WEKO_SWORDSERVER_E_12xx` 付き）と応答だけで区別できる（HTTPステータスは同じ 403）。「要確認」のセルは結果を記録し、設計者に確認する。
