id: VP-SW-BD-13
title: 依存先（DB／Redis／Elasticsearch）障害は 503
rationale: 前提：障害注入対象を1つずつ停止または接続断にする（下表）。Direct のクライアント。操作：下表の対象×EP を呼ぶ。期待結果：下表のとおり。HTTP 503、`@type` が `ServiceUnavailable`、コード帯 `WEKO_SWORDSERVER_E_31xx`。依存先ごとに別のコード（3108／3109／3110）。500・400 にならない。
