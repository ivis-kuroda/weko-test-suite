id: VP-SW-UI-22
title: 管理画面で一括インポート中のアイテムを SWORD から削除する（EP5 の 409）
rationale: 前提：Direct のクライアント（C-D）。管理画面の一括インポートを実行中（完了前）のアイテム。操作：EP5 で同アイテムを削除する。インポート完了後にもう一度削除する。期待結果：実行中は HTTP 409、`@type` が `Conflict`、コード帯 `WEKO_SWORDSERVER_E_22xx`。完了後は削除成功。画面のインポート結果は削除要求の影響を受けない。
source:
