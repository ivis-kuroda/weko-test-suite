id: VP-SW-AU-10
title: Workflow 経路のアクティビティ用スコープ有無 × EP（EP2／EP4／EP5）
rationale: "前提：Workflow のクライアント。トークン①（スコープあり）／トークン②（なし）。EP4・EP5 は登録済みアイテム。操作：トークン①②それぞれで EP2 で登録、EP4 で更新、EP5 で削除する（スコープ有無×3EP。下表）。操作後にアイテムとアクティビティの状態を確認する。期待結果：下表のとおり。スコープなしは HTTP 403、コード帯 `WEKO_SWORDSERVER_E_12xx`（1201）で、AU-30（ロール不足 403、独自コードなし）とは文言・コードが異なる（HTTPステータスは同じ 403 のため、応答のコードの有無で区別できる）。スコープなしの場合はアイテム・アクティビティが DB に作成・変更・削除されない（EP5 はアイテムが削除されない）。POST/PUT では展開済みの一時ディレクトリ（`TempDirInfo`、有効期限 1 日）が残る場合があるが、失敗にせず記録のみとする（F-14、U-13）。スコープありは 403 にならず、正常または `WEKO_SWORDSERVER_E_24xx`（スコープ有無でのみ結果が変わる）。注記（実コード順。F-05、U-09）：12xx（1201）の判定は Workflow 経路のみで、POST は Digest（1306）・`check_import_items`（形式・SwordClient・ワークフロー: 1409／1410／2103〜2105）の後、項目検証（1501）・登録済み（1502）・重複チェック（1503）の前に行う。PUT は recid 存在確認（2101）の後で同じ位置（1501・1504〜1506・1503 の前）。EP5 は recid 存在（2101）・DOI（2106）・クライアント設定（2103／2104／3102）の後、ロック（2201）の前に行う。トークンに write・actions・item_* が無い場合は、12xx ではなくコードなしの汎用 403（AU-34）になる。"
