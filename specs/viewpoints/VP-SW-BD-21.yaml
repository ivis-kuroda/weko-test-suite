id: VP-SW-BD-21
title: インポートチェックの想定外例外は 501
rationale: "前提：check_jsonld_import_items 内で例外（例: マッピング未定義）。操作：EP2 と EP4 を呼ぶ。期待結果：HTTP 501（変更前 400）、`@type` が `NotImplemented`、コード帯 `WEKO_SWORDSERVER_E_32xx`（データ不整合などを起因とし、再試行しても直らないため 501）。500 ではない。クライアント起因のデータ検証（15xx）にならない。"
source:
