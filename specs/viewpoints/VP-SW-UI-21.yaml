id: VP-SW-UI-21
title: 継続しないまま放置したアクティビティの扱い
rationale: 前提：BD-30 の応答後、画面操作をしない。操作：EP3 でステータスを取得する（recid は管理画面のアクティビティ詳細などから取得する。24xx 応答は継続 URL のみで recid を含まない）。期待結果：実際に返る状態（200、または 404／2101）を記録する。3107 の 501 は EP3 から到達できない（BD-20 と同じ理由）ため、「501 にならない」は自明に成立し主期待にしない。
