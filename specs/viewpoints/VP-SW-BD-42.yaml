id: VP-SW-BD-42
title: 登録ファイルの不正（bagit／文字コード不正／JSON 構文不正）に対し、内部エラー文字列を含まず、修正・再送を促す
rationale: 前提：不正な登録ファイル（bagit 不正＝チェックサム不一致など `validate()` で失敗するもの、文字コード不正、JSON 構文不正）。壊れた ZIP は対象外（S5-09）。操作：EP2 で登録する。期待結果：HTTP 400、コード帯 `WEKO_SWORDSERVER_E_15xx`（1501）。`error` は原因区分に応じた説明で、入力・パッケージ・メタデータの不備を示し、何を直して再送するかを案内する。内部例外文字列を含まない。JSON 構文不正は行・列のみを示しファイル内容の断片を含まない（文言はロケールで訳される）。bagit・文字コードは固定の説明文。対象は bagit・文字コード・JSON 構文の 3 種のみ（詳細 2.7）。壊れた ZIP（ZIP として開けないもの）はこの期待に含めない（設計に規定なし。現状コードは 501／3201。S5-09、U-16）。bagit の構造欠落（`bagit.txt` なし等）は 1501 か 3201 かを実測して記録する（F-12）。
