id: VP-SW-UI-02
title: SwordClient が未登録・無効のとき（設定不整合は管理者確認を促す）
rationale: 前提：管理画面で SwordClient を削除する、または無効にする（無効は EP2 のみ。EP5 は SwordClient の有効・無効を判定しない）。SwordClient 未登録のクライアントID のトークンも用意。操作：そのクライアントのトークン（未登録のクライアントID を含む）で EP2・EP5 を呼ぶ（無効にした SwordClient は EP2 のみで 21xx を確認し、EP5 は削除または未登録で確認する。無効での EP5 は実装どおり削除成功を確認する）。期待結果：HTTP 400、コード帯 `WEKO_SWORDSERVER_E_21xx`。設定不整合として管理者確認を促す。EP2・EP5 とも同じコード帯。管理画面で登録（無効の場合は有効化）後に再実行すると成功する。EP5 を SwordClient「無効」で呼ぶ場合は 2103 にならず削除が成功する（実装。詳細 2.0 の 2103「未登録・無効」との差異は U-18）。「設定不整合として管理者確認を促す文言」は基本設計 4.2 を正とし、現行メッセージ（2103〜2105）に管理者確認の文言がなく不合格となる場合は「実装不具合（メッセージ案内なし）」として記録する（U-17）。
