id: VP-SW-BD-10
title: EP4 のロック（他処理が編集予定）は 409
rationale: 前提：Direct のクライアント。対象アイテムが別処理でロック中（編集予定のロック）。操作：EP4 で更新する。Workflow のクライアントでも同じアイテムを EP4 で更新する。期待結果：Direct は HTTP 409、`@type` が `Conflict`、コード帯 `WEKO_SWORDSERVER_E_22xx`（2201）。変更前の 400 ではない。Workflow 経路の挙動は EG-03 を参照。
