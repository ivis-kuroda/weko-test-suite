id: VP-SW-AU-01
title: トークン状態（未提示／無効）× 全EP は 401、コードなし
rationale: 前提：トークン④（未提示）、トークン③（失効した無効トークン）。操作：トークン状態（未提示／無効）それぞれで EP1〜EP5 を呼ぶ（2状態×5EP）。期待結果：未提示は全EPで 401。無効（失効）トークンも 401 を想定するが、基本設計 4.2 は「認証失敗403」とも記載しており設計から確定できないため、S0-06 のベースライン実測値（401 または 403）で確定し本欄を更新する（U-21）。`error` に `WEKO_SWORDSERVER_E_` の独自コード（`WEKO_SWORDSERVER_E_11xx` を含む）が付かない。改修前と同じ文言・形式。未提示と無効で文言が同じ。C-AUTH-1・C-AUTH-2 を満たす。
