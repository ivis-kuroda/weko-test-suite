id: SC-SW-S12-02
title: HTTP ステータスだけを見るクライアント（CL-A）が既存エラーの 400／404 を従来どおり判定できる
preconditions: []
steps:
  - id: S-400
    summary: "400: Content-Disposition なし。ステータスだけで判定"
    action:
      operation: OP-SWORD-POST
      params:
        digest: SHA-256=787a496989b82b049c4eb338baae2d8a35a197d544ade7a2aa10854755cbff74
        file: fixtures/generated/simplezip-normal.zip
        filename: simplezip-normal.zip
        packaging: http://purl.org/net/sword/3.0/package/SimpleZip
        token: "{{env.SW_TOKEN_1}}"
    expect:
      - kind: http_status
        status: 400
        viewpoints: []
    polarity: error
    dependsOn: []
    produces: {}
    viewpoints: []
  - id: S-404
    summary: "404: 存在しない recid の EP3。ステータスだけで判定"
    action:
      operation: OP-SWORD-GET-DEPOSIT
      params:
        recid: "{{env.SW_R9}}"
        token: "{{env.SW_TOKEN_1}}"
    expect:
      - kind: http_status
        status: 404
        viewpoints: []
    polarity: error
    dependsOn:
      - S-400
    produces: {}
    viewpoints: []
cleanup: []
evidence:
  sources:
    - screenshot
    - browser_console
    - browser_network
    - db_records
    - app_log
    - db_log
  timing: before_and_after
  trace: on_failure
  ignore:
    - WARNING.*WEKO_SWORDSERVER_E_1303
    - WARNING.*Cannot get filename by Content-Disposition\.
    - WARNING.*WEKO_SWORDSERVER_E_2101
    - WARNING.*Item not found\. \(recid=
evidenceWaivers: []
tags:
  - spec:S12-02
  - tier:1
  - blocked:config-toggle-S5-03
  - blocked:pre-change-baseline
appliesTo:
  branch: test/sword-error-codes
  release: integration_test_spec_v4.2
viewpoints:
  - VP-SW-CP-02
note: CL-A は『ステータスだけを見る』クライアントなので、生成テストの http_status 判定そのもので表現した（独立のクライアント実装は用意しない）。413 は上限を下げる設定変更（S0-12）が要るため含めない。改修前の記録との比較は S0-06 が前提。
