      operation: OP-SWORD-GET-DEPOSIT
      params:
        recid: "{{env.SW_R9}}"
        token: "{{env.SW_TOKEN_1}}"
    expect:
      - kind: http_status
        status: 404
        viewpoints: []
      - kind: result
        assert:
          kind: keys
          value:
            - "@context"
            - "@type"
            - timestamp
            - error
          at: body
        viewpoints: []
      - kind: result
        assert:
          kind: matches
          pattern: "^WEKO_SWORDSERVER_E_2101: Item not found\\. \\(recid=\\d+\\)"
          at: body.error
        viewpoints: []
      - kind: result
        assert:
          kind: equals
          value: NotFound
          at: body.@type
        viewpoints: []
    polarity: error
    dependsOn: []
    produces: {}
    viewpoints: []
