id: SC-SW-S11-01
title: ロケール指定なしの代表エラー（13xx・21xx）は英語で、識別子（大文字スネーク）がそのまま出ない
preconditions: []
steps:
  - id: S-13XX
    summary: 13xx（Content-Disposition なし）の説明は英語
    action:
      operation: OP-SWORD-POST
      params:
        digest: SHA-256=787a496989b82b049c4eb338baae2d8a35a197d544ade7a2aa10854755cbff74
        file: fixtures/generated/simplezip-normal.zip
        filename: simplezip-normal.zip
        packaging: http://purl.org/net/sword/3.0/package/SimpleZip
        token: "{{env.SW_TOKEN_1}}"
    expect:
      - kind: http_status
        status: 400
        viewpoints: []
      - kind: result
        assert:
          kind: keys
          value:
            - "@context"
            - "@type"
            - timestamp
            - error
          at: body
        viewpoints: []
      - kind: result
        assert:
          kind: matches
          pattern: "^WEKO_SWORDSERVER_E_1303: "
          at: body.error
        viewpoints: []
      - kind: result
        assert:
          kind: equals
          value: BadRequest
          at: body.@type
        viewpoints: []
      - kind: result
        assert:
          kind: matches
          pattern: "^WEKO_SWORDSERVER_E_\\d{4}: [A-Z][a-z]+ [\\s\\S]*$"
          at: body.error
        viewpoints: []
      - kind: result
        assert:
          kind: matches
          pattern: "^WEKO_SWORDSERVER_E_\\d{4}: (?![\\s\\S]*\\b[A-Z][A-Z0-9]+_[A-Z0-9_]+\\b)[\\s\\S]*$"
          at: body.error
        viewpoints: []
    polarity: error
    dependsOn: []
    produces: {}
    viewpoints: []
  - id: S-21XX
    summary: 21xx（存在しない recid）の説明は英語で recid が埋まる
    action:
      operation: OP-SWORD-GET-DEPOSIT
      params:
        recid: "{{env.SW_R9}}"
        token: "{{env.SW_TOKEN_1}}"
    expect:
      - kind: http_status
        status: 404
        viewpoints: []
      - kind: result
        assert:
          kind: keys
          value:
            - "@context"
            - "@type"
            - timestamp
            - error
          at: body
        viewpoints: []
      - kind: result
        assert:
          kind: matches
          pattern: "^WEKO_SWORDSERVER_E_2101: Item not found\\. \\(recid=\\d+\\)"
          at: body.error
        viewpoints: []
      - kind: result
        assert:
          kind: equals
          value: NotFound
          at: body.@type
        viewpoints: []
      - kind: result
        assert:
          kind: matches
          pattern: "^WEKO_SWORDSERVER_E_\\d{4}: [A-Z][a-z]+ [\\s\\S]*$"
          at: body.error
        viewpoints: []
      - kind: result
        assert:
          kind: matches
          pattern: "^WEKO_SWORDSERVER_E_\\d{4}: (?![\\s\\S]*\\b[A-Z][A-Z0-9]+_[A-Z0-9_]+\\b)[\\s\\S]*$"
          at: body.error
        viewpoints: []
    polarity: error
    dependsOn:
      - S-13XX
    produces: {}
    viewpoints: []
cleanup: []
evidence:
  sources:
    - screenshot
    - browser_console
    - browser_network
    - db_records
    - app_log
    - db_log
  timing: before_and_after
  trace: on_failure
  ignore:
    - (WARNING|ERROR).*WEKO_SWORDSERVER_E_1303
    - (WARNING|ERROR).*Cannot get filename by Content-Disposition\.
    - (WARNING|ERROR).*WEKO_SWORDSERVER_E_2101
    - (WARNING|ERROR).*Item not found\. \(recid=
evidenceWaivers: []
tags:
  - spec:S11-01
  - tier:1
  - finding:A-5-on-hold
appliesTo:
  branch: test/sword-error-codes
  release: integration_test_spec_v4.2
viewpoints:
  - VP-SW-BD-50
note: ロケールを指定せずに送る（Accept-Language を付けない）。ロケール指定方法そのものは U-11（要確認）。『英語』は先頭語が英字で始まることと識別子が出ないことで近似し、言語の厳密な判定は ai_judgement を使わず人が確認する。
