[project]
name = "weko-test-suite-tools"
version = "0.0.0"
description = "Deterministic spec importer and static conformance checks for the WEKO3 test suite"
requires-python = ">=3.11"
dependencies = ["openpyxl>=3.1"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
